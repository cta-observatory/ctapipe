[workspace]
name = "ctapipe"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

# numba rc is missing metadata in conda package for this mapping
[workspace.conda-pypi-map]
numba = { mapping = { numba = "numba", llvmlite = "llvmlite" } }

# Keep constraints in sync with pyproject.toml. The default environment contains
# only the required runtime dependencies and an editable ctapipe installation.
[dependencies]
python = ">=3.12,<3.16"
# The astropy metapackage also installs Astropy's optional dependencies.
astropy-base = ">=6.1,<9"
docutils = "*"
joblib = "*"
numba = ">=0.59"
numpy = ">=1.26,<3"
packaging = "*"
psutil = "*"
pyyaml = ">=5.1"
requests = "*"
scikit-learn = "!=1.4.0"
scipy = ">=1.15,<2"
pytables = ">=3.4,<4"
tqdm = ">=4.32"
traitlets = ">=5.6,<6"

[pypi-dependencies]
ctapipe = { path = ".", editable = true }

[feature.eventio.dependencies]
eventio = ">=1.9.1,<3"

[feature.optional.dependencies]
bokeh = ">=3,<4"
hist = "*"
iminuit = ">=2"
matplotlib = ">=3,<4"
pyirf = ">=0.14,<0.15"
zernike = "*"

[feature.test.dependencies]
astroquery = "*"
pandas = "*"
pytest = ">=9"
pytest-cov = "*"
pytest-xdist = "*"
pytest-astropy-header = "*"
tomli = "*"

[feature.test.pypi-dependencies]
ctapipe_test_plugin = { path = "test_plugin", editable = true }

[feature.test.tasks]
test = "pytest"

[feature.doc.dependencies]
ffmpeg = "*"
ffmpeg-python = "*"
graphviz = "*"
python-graphviz = "*"
ipython = "*"
jupyter = "*"
mplhep = "*" # hist[plot]
nbsphinx = "*"
notebook = "*"
numpydoc = "*"
pandas = "*"
pandoc = "*"
pydata-sphinx-theme = "*"
pypandoc = "*"
sphinx = ">=9.1,<9.2"
sphinx-automodapi = "*"
sphinx-design = "*"
sphinx-gallery = ">=0.16"
sphinxcontrib-bibtex = "*"
sphinx_changelog = "*"
make = "*"

[feature.doc.tasks]
doc = "make doc"

[feature.dev.dependencies]
cython = "*"
ipywidgets = "*"
pip = "*"
pre-commit = "*"
python-build = "*"
ruff = "*"
setuptools = ">=64"
setuptools-scm = ">=8"
towncrier = "*"
vitables = "*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314]
platforms = ["linux-64", "osx-arm64"]  # Recent numba releases no longer support Intel macOS.

[feature.py314.dependencies]
python = "3.14.*"

[feature.py315]
platforms = ["linux-64", "osx-arm64"]  # Recent numba releases no longer support Intel macOS.
channels = [
  "numba",                        # for numba rc with python 3.15 support
  "conda-forge",
  "conda-forge/label/python_rc",  # for python rc
]

[feature.py315.dependencies]
python = "3.15.*"

[feature.oldest-deps.dependencies]
numpy = "1.26.*"
numba = "==0.59.0"
scipy = "1.15.*"
astropy-base = "6.1.*"
matplotlib = "3.8.*"
eventio = "==1.11.6"

[environments]
default = { features = ["py314"], solve-group = "py314" }
optional = { features = ["py314", "eventio", "optional"], solve-group = "py314" }
test = { features = ["py314", "eventio", "test"], solve-group = "py314" }
test-all = { features = ["py314", "eventio", "optional", "test"], solve-group = "py314" }
doc = { features = ["py314", "eventio", "optional", "doc"], solve-group = "py314" }
dev = { features = ["py314", "eventio", "optional", "test", "doc", "dev"], solve-group = "py314" }
test-py312 = { features = ["py312", "eventio", "optional", "test"], solve-group = "py312" }
test-py313 = { features = ["py313", "eventio", "optional", "test"], solve-group = "py313" }
test-py314 = { features = ["py314", "eventio", "optional", "test"], solve-group = "py314" }
test-py315 = { features = ["py315", "eventio", "test"], solve-group = "py315" }
test-oldest = { features = ["py312", "eventio", "optional", "test", "oldest-deps"] }
