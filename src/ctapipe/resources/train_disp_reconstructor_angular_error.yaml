# ======================================================================
# ctapipe-train-disp-reconstructor config file with the optional
# angular-error regressor enabled (EventDisplay-style direction weighting).
# version: VERSION
#
# The angular-error regressor predicts the expected per-telescope angular
# reconstruction error. Its prediction is stored as the per-telescope
# ``ang_distance_uncert`` and can be used as an exponential penalty weight in
# the stereo direction combination via ``weights = "angular-error"`` (configured
# in the ctapipe-process / ctapipe-apply-models step, see the bottom of this
# file).
#
# To support divergent-pointing analyses, the telescope position in the array
# (``pos_x``, ``pos_y``, ``pos_z``) is included among the angular-error
# features.
# ======================================================================

TrainDispReconstructor:
  random_seed: 0
  n_events:
    # - [type, "LST*", 1000]
    # - [type, "MST*", 1000]

  CrossValidator:
    n_cross_validations: 5
    rng_seed: 1337

  DispReconstructor:
    n_jobs: -1

    # --- norm(disp) regression ------------------------------------------
    norm_cls: ExtraTreesRegressor
    norm_config:
      n_estimators: 10
      max_depth: 10
    log_target: True

    # --- sign(disp) classification --------------------------------------
    sign_cls: ExtraTreesClassifier
    sign_config:
      n_estimators: 10
      max_depth: 10

    # --- angular-error regression ---------------------------------------
    # Enable the additional regressor predicting the per-telescope angular
    # error. It is trained after the norm/sign models on the same events,
    # targeting the angular separation between the reconstructed per-telescope
    # direction (alt/az) and the true direction.
    predict_angular_error: True
    angular_error_cls: ExtraTreesRegressor
    angular_error_config:
      n_estimators: 10
      max_depth: 10
    # Train on ln(angular_error); errors span orders of magnitude.
    log_angular_error: True
    # Features for the angular-error regressor. If omitted, the disp features
    # (below) are reused. Here we additionally include the telescope position
    # in the array so the model can account for divergent pointing.
    angular_error_features:
      - hillas_intensity
      - hillas_length
      - hillas_width
      - hillas_r
      - hillas_skewness
      - hillas_kurtosis
      - timing_slope
      - leakage_intensity_width_2
      - concentration_cog
      - morphology_n_pixels
      - ExtraTreesRegressor_tel_energy
      - pos_x  # telescope x position in the array (TiltedGroundFrame)
      - pos_y  # telescope y position in the array
      - pos_z  # telescope z position in the array

    MLQualityQuery:  # Event Selection performed before training the models
      quality_criteria:
        - ["HillasValid", "HillasReconstructor_is_valid"]
        - ["enough intensity", "hillas_intensity > 50"]
        - ["Positive width", "hillas_width > 0"]
        - ["enough pixels", "morphology_n_pixels > 3"]
        - ["not clipped", "leakage_intensity_width_2 < 0.5"]

    FeatureGenerator:  # On-the-fly generation of additional features
      features:
        - ["area", "hillas_width * hillas_length"]

    features:
      - hillas_intensity
      - hillas_r
      - hillas_length
      - hillas_width
      - hillas_skewness
      - hillas_kurtosis
      - timing_slope
      - timing_deviation
      - leakage_intensity_width_1
      - leakage_intensity_width_2
      - leakage_pixels_width_1
      - leakage_pixels_width_2
      - concentration_cog
      - concentration_core
      - morphology_n_islands
      - morphology_n_large_islands
      - morphology_n_medium_islands
      - morphology_n_pixels
      - morphology_n_small_islands
      - peak_time_std
      - peak_time_skewness
      - peak_time_kurtosis
      - intensity_max
      - intensity_mean
      - intensity_std
      - intensity_skewness
      - intensity_kurtosis
      - ExtraTreesRegressor_energy      # Mean predicted energy of the array event
      - ExtraTreesRegressor_tel_energy  # Energy prediction for single telescope image
      - area  # Features generated by the FeatureGenerator still have to be listed here
              # for the models to use them.

    # To actually use the predicted angular error as a stereo weight, configure
    # the stereo combiner where the models are applied (ctapipe-process or
    # ctapipe-apply-models), e.g.:
    #
    # stereo_combiner_cls: "StereoMeanCombiner"
    # StereoMeanCombiner:
    #   weights: "angular-error"
    #   angular_error_scale: 0.2  # degrees; the default reproduces the EventDisplay
    #                             # weighting exp(-5 * ang_distance_uncert)
