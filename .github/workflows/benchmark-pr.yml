name: Benchmark pull request

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  benchmark:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'benchmark') &&
      (github.event.action != 'labeled' || github.event.label.name == 'benchmark')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: benchmark-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      MKL_NUM_THREADS: 1
      NUMBA_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          path: ctapipe
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: cta-observatory/ctapipe-asv
          ref: main
          path: ctapipe-asv
          persist-credentials: false

      - uses: ./ctapipe-asv/.github/actions/setup-asv

      - name: Compare base and PR merge commits
        id: comparison
        shell: bash
        working-directory: ctapipe-asv
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          uv run --no-sync asv machine --yes
          status=0
          uv run --no-sync asv continuous --config asv.conf.local.json --interleave-rounds \
            --split --no-only-changed --show-stderr "$BASE_SHA" "$GITHUB_SHA" \
            2>&1 | tee comparison.txt || status=$?
          {
            printf '### ASV benchmark comparison\n\n'
            printf 'Base: `%s`\n\nPR merge: `%s`\n\nSuite: `%s`\n\n' \
              "$BASE_SHA" "$GITHUB_SHA" "$(git rev-parse HEAD)"
            printf '````text\n'
            cat comparison.txt
            printf '\n````\n'
          } >> "$GITHUB_STEP_SUMMARY"

          # ASV exits with 1 when it detects a performance regression.
          summary="$RUNNER_TEMP/asv-pr-summary-$GITHUB_RUN_ATTEMPT.txt"
          if [[ "$status" -le 1 ]] &&
            uv run --no-sync asv compare --config asv.conf.local.json --split \
              --sort ratio "$BASE_SHA" "$GITHUB_SHA" > "$summary" &&
            [[ -s "$summary" ]]; then
            printf 'summary_ready=true\n' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Upload the PR comment summary
        if: ${{ !cancelled() && steps.comparison.outputs.summary_ready == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/asv-pr-summary-${{ github.run_attempt }}.txt
          archive: false
          if-no-files-found: error

      - name: Upload PR benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: asv-pr-results
          path: |
            ctapipe-asv/comparison.txt
            ctapipe-asv/results/
